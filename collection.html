    <script>
        const overlay = document.getElementById('overlay');
        const menuBtn = document.getElementById('menuBtn');
        const overlayClose = document.getElementById('overlayClose');
        const overlayClock = document.getElementById('overlayClock');

        function updateClock() {
            const parts = new Intl.DateTimeFormat('en-GB', {
                timeZone: 'Europe/Paris',
                day: '2-digit', month: '2-digit', year: 'numeric',
                hour: '2-digit', minute: '2-digit', hour12: true
            }).formatToParts(new Date());
            const p = {};
            parts.forEach((x) => { p[x.type] = x.value; });
            overlayClock.textContent =
                p.day + '/' + p.month + '/' + p.year + ' ' +
                p.hour + ':' + p.minute + ' ' +
                (p.dayPeriod || '').toLowerCase() + ' PAR';
        }

        function openMenu() {
            overlay.classList.add('open');
            overlay.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden';
            updateClock();
        }

        function closeMenu() {
            overlay.classList.remove('open');
            overlay.setAttribute('aria-hidden', 'true');
            document.body.style.overflow = '';
        }

        menuBtn.addEventListener('click', openMenu);
        overlayClose.addEventListener('click', closeMenu);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeMenu();
        });

        updateClock();
        setInterval(updateClock, 60000);
    </script>

    <script>
        (function () {
            const radio = document.getElementById('radio');
            const radioToggle = document.getElementById('radioToggle');
            const bgMusic = document.getElementById('bgMusic');
            if (!bgMusic) return;
            bgMusic.volume = 0.4;
            const MUSIC_STOPPED_KEY = 'pfmMusicStopped';

            radioToggle.addEventListener('click', () => {
                if (bgMusic.paused) {
                    sessionStorage.removeItem(MUSIC_STOPPED_KEY);
                    bgMusic.play().catch(() => { });
                } else {
                    sessionStorage.setItem(MUSIC_STOPPED_KEY, '1');
                    bgMusic.pause();
                }
            });

            bgMusic.addEventListener('play', () => {
                radio.classList.add('playing');
                radioToggle.setAttribute('aria-pressed', 'true');
                radioToggle.setAttribute('aria-label', 'Pause PFM Radio');
            });
            bgMusic.addEventListener('pause', () => {
                radio.classList.remove('playing');
                radioToggle.setAttribute('aria-pressed', 'false');
                radioToggle.setAttribute('aria-label', 'Play PFM Radio');
            });

            // Auto-start on first interaction unless the user chose to stop the music
            if (sessionStorage.getItem(MUSIC_STOPPED_KEY) !== '1') {
                const autoStartMusic = () => { bgMusic.play().catch(() => { }); };
                document.addEventListener('click', autoStartMusic, { once: true });
                document.addEventListener('touchstart', autoStartMusic, { once: true });
            }
        })();
    </script>

                            product { title }
                            price { amount currencyCode }
                        } }
                    } }
                }`;

            async function cartCreate(variantId, qty) {
                const q = `mutation($input: CartInput!){ cartCreate(input:$input){ cart{ ${CART_FIELDS} } userErrors{ message } } }`;
                const d = await gql(q, { input: { lines: [{ merchandiseId: variantId, quantity: qty }] } });
                if (d.cartCreate.userErrors.length) throw new Error(d.cartCreate.userErrors[0].message);
                return d.cartCreate.cart;
            }
            async function cartGet(id) {
                const q = `query($id: ID!){ cart(id:$id){ ${CART_FIELDS} } }`;
                const d = await gql(q, { id });
                return d.cart; // null si le panier a expiré
            }
            async function cartLinesAdd(id, variantId, qty) {
                const q = `mutation($cartId: ID!, $lines: [CartLineInput!]!){ cartLinesAdd(cartId:$cartId, lines:$lines){ cart{ ${CART_FIELDS} } userErrors{ message } } }`;
                const d = await gql(q, { cartId: id, lines: [{ merchandiseId: variantId, quantity: qty }] });
                if (d.cartLinesAdd.userErrors.length) throw new Error(d.cartLinesAdd.userErrors[0].message);
                return d.cartLinesAdd.cart;
            }
            async function cartLinesUpdate(id, lineId, qty) {
                const q = `mutation($cartId: ID!, $lines: [CartLineUpdateInput!]!){ cartLinesUpdate(cartId:$cartId, lines:$lines){ cart{ ${CART_FIELDS} } userErrors{ message } } }`;
                const d = await gql(q, { cartId: id, lines: [{ id: lineId, quantity: qty }] });
                if (d.cartLinesUpdate.userErrors.length) throw new Error(d.cartLinesUpdate.userErrors[0].message);
                return d.cartLinesUpdate.cart;
            }
            async function cartLinesRemove(id, lineId) {
                const q = `mutation($cartId: ID!, $lineIds: [ID!]!){ cartLinesRemove(cartId:$cartId, lineIds:$lineIds){ cart{ ${CART_FIELDS} } userErrors{ message } } }`;
                const d = await gql(q, { cartId: id, lineIds: [lineId] });
                if (d.cartLinesRemove.userErrors.length) throw new Error(d.cartLinesRemove.userErrors[0].message);
                return d.cartLinesRemove.cart;
            }

            // --- état + rendu ---
            let cart = null;

            function fmtPrice(amount, currency) {
                const n = Math.round(parseFloat(amount));
                return n + ' ' + (currency === 'EUR' ? 'EUR' : currency);
            }

            const els = {
                count: document.getElementById('cartCount'),
                items: document.getElementById('cartItems'),
                subtotal: document.getElementById('cartSubtotal'),
                overlay: document.getElementById('cartOverlay'),
                drawer: document.getElementById('cartDrawer'),
                checkout: document.getElementById('cartCheckout')
            };

            function totalQty(c) {
                if (!c) return 0;
                return c.lines.edges.reduce((s, e) => s + e.node.quantity, 0);
            }

            function render() {
                const count = totalQty(cart);
                els.count.textContent = count;

                if (!cart || cart.lines.edges.length === 0) {
                    els.items.innerHTML = '<div class="cart-empty">Your cart is empty</div>';
                    els.subtotal.textContent = '0 EUR';
                    els.checkout.disabled = true;
                    return;
                }
                els.checkout.disabled = false;

                els.items.innerHTML = cart.lines.edges.map(function (e) {
                    const n = e.node;
                    const m = n.merchandise;
                    const size = (m.title && m.title !== 'Default Title') ? m.title : 'One Size';
                    const lineTotal = fmtPrice(parseFloat(m.price.amount) * n.quantity, m.price.currencyCode);
                    return '' +
                        '<div class="cart-line" data-line="' + n.id + '">' +
                            '<div class="cart-line-main">' +
                                '<span class="cart-line-name">' + m.product.title + '</span>' +
                                '<span class="cart-line-meta">Size ' + size + '</span>' +
                                '<div class="cart-qty">' +
                                    '<button type="button" data-act="dec" aria-label="Decrease">&#8722;</button>' +
                                    '<span>' + n.quantity + '</span>' +
                                    '<button type="button" data-act="inc" aria-label="Increase">+</button>' +
                                '</div>' +
                            '</div>' +
                            '<div class="cart-line-right">' +
                                '<span class="cart-line-price">' + lineTotal + '</span>' +
                                '<button type="button" class="cart-remove" data-act="remove">Remove</button>' +
                            '</div>' +
                        '</div>';
                }).join('');

                const sub = cart.cost.subtotalAmount;
                els.subtotal.textContent = fmtPrice(sub.amount, sub.currencyCode);
            }

            function saveId() {
                try { if (cart) localStorage.setItem(CART_KEY, cart.id); } catch (e) {}
            }

            // --- ouverture / fermeture ---
            function openDrawer() {
                els.overlay.classList.add('open');
                els.drawer.classList.add('open');
                els.drawer.setAttribute('aria-hidden', 'false');
            }
            function closeDrawer() {
                els.overlay.classList.remove('open');
                els.drawer.classList.remove('open');
                els.drawer.setAttribute('aria-hidden', 'true');
            }

            document.getElementById('cartBtn').addEventListener('click', openDrawer);
            document.getElementById('cartClose').addEventListener('click', closeDrawer);
            els.overlay.addEventListener('click', closeDrawer);
            document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDrawer(); });

            // --- actions dans les lignes (delegation) ---
            els.items.addEventListener('click', async function (e) {
                const btn = e.target.closest('[data-act]');
                if (!btn || !cart) return;
                const lineEl = e.target.closest('[data-line]');
                if (!lineEl) return;
                const lineId = lineEl.getAttribute('data-line');
                const act = btn.getAttribute('data-act');
                const node = cart.lines.edges.find(x => x.node.id === lineId);
                if (!node) return;
                const currentQty = node.node.quantity;

                btn.disabled = true;
                try {
                    if (act === 'inc') cart = await cartLinesUpdate(cart.id, lineId, currentQty + 1);
                    else if (act === 'dec') {
                        if (currentQty <= 1) cart = await cartLinesRemove(cart.id, lineId);
                        else cart = await cartLinesUpdate(cart.id, lineId, currentQty - 1);
                    }
                    else if (act === 'remove') cart = await cartLinesRemove(cart.id, lineId);
                    saveId();
                    render();
                } catch (err) {
                    console.error('Cart update error:', err);
                    btn.disabled = false;
                }
            });

            // --- checkout ---
            els.checkout.addEventListener('click', function () {
                if (cart && cart.checkoutUrl) {
                    els.checkout.disabled = true;
                    els.checkout.textContent = '…';
                    window.location.href = cart.checkoutUrl;
                }
            });

            // --- API publique (partagée avec les fiches produit) ---
            window.PFMCart = {
                open: openDrawer,
                add: async function (variantId, qty) {
                    qty = qty || 1;
                    try {
                        if (!cart) {
                            const saved = (function(){ try { return localStorage.getItem(CART_KEY); } catch(e){ return null; } })();
                            if (saved) cart = await cartGet(saved);
                        }
                        if (cart && cart.id) cart = await cartLinesAdd(cart.id, variantId, qty);
                        else cart = await cartCreate(variantId, qty);
                        saveId();
                        render();
                        openDrawer();
                        return true;
                    } catch (err) {
                        console.error('Add to cart error:', err);
                        throw err;
                    }
                }
            };

            // --- init : recharge le panier existant au chargement de la page ---
            (async function init() {
                let saved = null;
                try { saved = localStorage.getItem(CART_KEY); } catch (e) {}
                if (saved) {
                    try {
                        cart = await cartGet(saved);
                        if (!cart) { try { localStorage.removeItem(CART_KEY); } catch (e) {} }
                    } catch (e) { cart = null; }
                }
                render();
            })();

            // recharge quand on revient via retour arrière (bfcache)
            window.addEventListener('pageshow', async function (e) {
                if (e.persisted) {
                    let saved = null;
                    try { saved = localStorage.getItem(CART_KEY); } catch (err) {}
                    if (saved) { try { cart = await cartGet(saved); } catch (err) {} }
                    render();
                }
            });
        })();
    </script>
</body>

</html>
